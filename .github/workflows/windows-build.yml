name: Windows build

on:
  push:
    branches:
      - main
      - issue-1-odyssey-optical-tracking
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Upload optical test
        uses: actions/upload-artifact@v4
        with:
          name: psvr-odyssey-optical-test
          path: build/dist/psvr/bin/win64/*
